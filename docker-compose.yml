services:
  db:
    image: postgres:15
    container_name: videostat-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.2.4-management
    container_name: videostat-rabbitmq
    # RabbitMQ хранит данные в папке rabbit@<hostname>. Без фиксированного hostname каждый
    # make down/up создаёт контейнер со случайным hostname → новый узел с пустыми данными,
    # и сообщения, лежавшие в очередях, теряются.
    hostname: rabbitmq
    restart: always
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}

  migrate:
    image: migrate/migrate:v4.17.0
    container_name: videostat-migrate
    depends_on:
      - db
    volumes:
      - ./migrations:/migrations
    entrypoint: [
      "migrate",
      "-path", "/migrations",
      "-database", "${DB_URL_MIGRATE}"
    ]

  buf:
    image: bufbuild/buf:1.66.0
    working_dir: /workspace
    volumes:
      - ./:/workspace
    entrypoint: ["buf"]

  minio:
    image: minio/minio:latest
    container_name: videostat-minio
    restart: always
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: videostat-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-videostat}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$S3_BUCKET &&
        mc anonymous set download local/$$S3_BUCKET &&
        echo 'MinIO bucket ready'
      "
    restart: on-failure

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: videostat-prometheus
    restart: always
    ports:
      - "9090:9090"   # Web UI + API
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle   # позволяет перечитать конфиг без рестарта: POST /-/reload
      - --enable-feature=exemplar-storage   # хранить exemplars (trace_id у значений гистограмм)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # доступ к сервисам, запущенным на хосте

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: videostat-postgres-exporter
    restart: always
    depends_on:
      - db
    # Порт наружу не пробрасываем: Prometheus ходит к нему по внутренней сети docker-compose
    environment:
      DATA_SOURCE_URI: db:5432/${DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: ${DB_USER}
      DATA_SOURCE_PASS: ${DB_PASS}

  loki:
    image: grafana/loki:3.5.0
    container_name: videostat-loki
    restart: always
    ports:
      - "3100:3100"   # API (Grafana ходит по внутренней сети, порт наружу — для отладки)
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./monitoring/loki/rules:/etc/loki/rules/fake:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yml

  tempo:
    image: grafana/tempo:2.8.1
    container_name: videostat-tempo
    restart: always
    ports:
      - "3200:3200"   # API (Grafana ходит по внутренней сети, порт наружу — для отладки)
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/tempo.yml

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: videostat-alloy
    restart: always
    depends_on:
      - loki
      - tempo
    ports:
      - "12345:12345"   # UI: схема конвейера и состояние компонентов
      - "4317:4317"     # OTLP gRPC: сюда Go-сервисы шлют трейсы
      - "4318:4318"     # OTLP HTTP
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/videostat:ro   # файлы логов наших Go-сервисов
      - alloy_data:/var/lib/alloy/data # позиции чтения файлов
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

  grafana:
    image: grafana/grafana:12.1.0
    container_name: videostat-grafana
    restart: always
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  db_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:
