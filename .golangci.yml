version: "2"

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - errorlint
    - nilerr
    - bodyclose
    - copyloopvar
    - noctx
    - nolintlint
    - misspell
    - whitespace
    - sloglint

  settings:
    sloglint:
      # Ключи логов только в snake_case (video_id, а не videoID) — как в событиях RabbitMQ.
      # Одинаковые имена во всех сервисах нужны, чтобы искать в Loki по полю: | json | video_id="..."
      key-naming-case: snake
