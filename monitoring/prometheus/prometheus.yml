# Глобальные настройки: как часто Prometheus опрашивает цели (scrape)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Список целей, с которых собираем метрики.
# Каждая цель должна отдавать метрики по HTTP в текстовом формате (обычно /metrics).
scrape_configs:
  # Prometheus собирает метрики сам с себя — удобно проверить, что всё работает
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Наш HTTP API.
  # Он запускается на хосте (make run), поэтому из контейнера адрес — host.docker.internal
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:8081"]

  # Воркеры: своего HTTP у них нет, поэтому /metrics отдаётся на отдельном порту
  # (METRICS_WORKER_*_ADDR в .env)
  - job_name: worker_core
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: worker_notify
    static_configs:
      - targets: ["host.docker.internal:9102"]

  - job_name: worker_cron
    static_configs:
      - targets: ["host.docker.internal:9103"]

  # --- Экспортеры: метрики чужих программ, без нашего кода ---

  # RabbitMQ отдаёт метрики сам (встроенный плагин rabbitmq_prometheus).
  # Он в той же docker-сети, поэтому обращаемся по имени сервиса, а не через host.docker.internal.
  # /metrics — сводные цифры по всему брокеру.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # /metrics/detailed — метрики по каждой очереди отдельно (длина, consumers, unacked).
  - job_name: rabbitmq_queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Postgres сам метрики не отдаёт — за него это делает postgres-exporter
  # (подключается к БД, выполняет служебные запросы и превращает ответы в метрики).
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
