# Loki в режиме «всё в одном процессе» с хранением на локальном диске — для разработки.
# В проде обычно хранят чанки в S3 (у нас есть MinIO) и запускают несколько компонентов.
auth_enabled: false   # без мультитенантности

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /etc/loki/rules   # правила алертов (см. ruler ниже)
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Схема хранения индекса. tsdb + v13 — текущий рекомендуемый вариант.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h   # храним 7 дней

# compactor удаляет логи старше retention_period
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# ruler — проверяет правила алертов на LogQL, как Prometheus на PromQL.
# Правила: monitoring/loki/rules/*.yml (подпапка fake — это tenant по умолчанию при auth_enabled: false).
# Отправки уведомлений пока нет (alertmanager_url не задан) — алерты видны в Grafana → Alerting.
ruler:
  rule_path: /loki/rules-temp
  evaluation_interval: 1m
  enable_api: true
