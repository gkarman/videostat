# Алерты по логам. Формат тот же, что у Prometheus, но в expr — LogQL.
#
# Когда алерт по логам, а когда по метрикам:
#   если событие можно посчитать метрикой — лучше метрика (дешевле, надёжнее, уже есть в Prometheus);
#   по логам — то, что метриками не считается: паники, конкретные тексты ошибок, редкие аварийные сообщения.

groups:
  - name: logs
    rules:
      # Паника — всегда баг. Middleware Recovery и cron.Recover её перехватывают и пишут в лог,
      # процесс продолжает работать, поэтому ни up, ни другие метрики этого не покажут.
      - alert: PanicInLogs
        expr: sum by (service) (count_over_time({env="local"} |~ "(?i)panic" [5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }}: паника в логах"
          description: "За 5 минут {{ $value }} строк с panic. Искать: {service=\"{{ $labels.service }}\"} |~ \"(?i)panic\""

      # Всплеск ошибок в логах — страховка на случай ошибок, для которых нет метрик.
      - alert: ErrorLogsSpike
        expr: sum by (service) (count_over_time({env="local", level="ERROR"} [5m])) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }}: много ошибок в логах"
          description: "{{ $value }} строк уровня ERROR за 5 минут."
