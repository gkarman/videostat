# Provisioning: Grafana при старте сама создаёт источник данных,
# чтобы не настраивать его руками в UI
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Фиксированный uid — по нему на источник ссылаются дашборды
    uid: prometheus
    access: proxy
    # Имя сервиса из docker-compose — контейнеры видят друг друга по имени
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Кнопка «Logs for this span»: открывает Loki с логами того же сервиса за время спана.
      # service.name в трейсах = service в Loki = job в Prometheus.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        tags:
          - key: service.name
            value: service
