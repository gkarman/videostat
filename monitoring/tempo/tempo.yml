# Tempo в режиме «всё в одном процессе», хранение на локальном диске — для разработки.
# В проде блоки трейсов хранят в S3 (у нас есть MinIO).

stream_over_http_enabled: true

server:
  http_listen_port: 3200   # API: сюда ходит Grafana

# Приём трейсов по OTLP. Сервисы шлют не сюда напрямую, а в Alloy, он пересылает в Tempo.
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m   # как часто сбрасывать накопленные трейсы в блоки на диск

compactor:
  compaction:
    block_retention: 168h  # храним 7 дней, как логи

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
